services:
  api:
    image: ghcr.io/abdulhanan394/abdul-core:latest
    env_file:
      - ../backend/.env
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: abdul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: abdul_core
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:

