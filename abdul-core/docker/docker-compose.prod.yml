services:
  api:
    image: ghcr.io/abdulhanan394/abdul-core:latest

    container_name: abdul-api

    env_file:
      - ../backend/.env

    restart: unless-stopped

    volumes:
      # RAG vector database memory
      - chroma_data:/app/chroma_data

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    container_name: abdul-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: abdul
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: abdul_core

    volumes:
      # Application database
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: abdul-redis

    restart: unless-stopped

    volumes:
      # Redis persistence
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine

    container_name: abdul-nginx

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

volumes:
  postgres_data:
  chroma_data:
  redis_data:
