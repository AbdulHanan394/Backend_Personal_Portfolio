name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/abdul-core:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deployment target pending
        run: |
          echo "TODO: choose VPS SSH docker-compose pull/up or a PaaS deploy hook."
          echo "The GHCR image build/push is complete; wire this step once hosting is selected."

