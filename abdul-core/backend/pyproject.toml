[project]
name = "abdul-core"
version = "0.1.0"
description = "Backend service for Abdul Hanan's portfolio intelligence layer"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "anthropic>=0.40.0",
  "apscheduler>=3.10.4",
  "asyncpg>=0.29.0",
  "bcrypt>=4.0.1,<4.1.0",
  "chromadb>=0.5.5,<0.6.0",
  "google-genai>=1.30.0",
  "fastapi>=0.115.0",
  "gunicorn>=22.0.0",
  "httpx>=0.27.0",
  "passlib[bcrypt]>=1.7.4",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-jose[cryptography]>=3.3.0",
  "redis>=5.0.8",
  "sentence-transformers>=3.0.1",
  "sqlalchemy[asyncio]>=2.0.32",
  "openai>=1.0.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.1",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
  "testcontainers[postgres,redis]>=4.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/services", "app/api"]
plugins = ["pydantic.mypy"]
[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["app"]